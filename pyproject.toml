[build-system]
requires = ["setuptools>=69", "wheel"]

build-backend = "setuptools.build_meta"

[project]
name = "ai-company"
version = "0.1.0"
description = "AI Company Platform"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "loguru",
    "httpx",
    "redis",
    "psycopg[binary]",
    "qdrant-client",
    "neo4j",
    "minio",
]
